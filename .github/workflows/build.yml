name: Build Waraqa from ZIP
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Extract project
        run: |
          mkdir -p project
          unzip -q Waraqa.zip -d project
      - name: Build and verify APK
        run: cd project && bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Waraqa-APK
          path: project/out/Waraqa-0.3.apk
          retention-days: 7
          if-no-files-found: error
